services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: farmease-staff-app
    ports:
      - "8082:80"
    volumes:
      - ./app:/var/www/html/app
      - ./writable:/var/www/html/writable
      - ./public:/var/www/html/public
      - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Manila
      app.baseURL: 'http://localhost:8082/'
      database.default.hostname: 'db'
      database.default.database: 'farmease_vrbms'
      database.default.username: 'docker-user'
      database.default.password: 'farmease-pass'

  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: farmease-staff-db
    command: --default-authentication-plugin=mysql_native_password --ssl=0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmease_vrbms
      MYSQL_USER: docker-user
      MYSQL_PASSWORD: farmease-pass
    ports:
      - "3307:3306"
    volumes:
      - staff-mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: farmease-staff-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8083:80"
    depends_on:
      - db

volumes:
  staff-mysql_data:
