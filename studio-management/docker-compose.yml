services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: farmease-studio-app
    ports:
      - "8084:80"
    volumes:
      - ./app:/var/www/html/app
      - ./writable:/var/www/html/writable
      - ./public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Manila
      app.baseURL: 'http://localhost:8084/'
      database.default.hostname: 'db'
      database.default.database: 'farmease_vrbms'
      database.default.username: 'docker-user'
      database.default.password: 'farmease-pass'

  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: farmease-studio-db
    command: --default-authentication-plugin=mysql_native_password --ssl=0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmease_vrbms
      MYSQL_USER: docker-user
      MYSQL_PASSWORD: farmease-pass
    ports:
      - "3308:3306"
    volumes:
      - studio-mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 20s
      retries: 10
      interval: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: farmease-studio-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8085:80"
    depends_on:
      - db

volumes:
  studio-mysql_data:
